[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/balcsida/zendesk-rs"

[workspace.dependencies]
zendesk = { path = "crates/zendesk" }
# MCP protocol: stdio and streamable HTTP server transports.
rmcp = { version = "3.5", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
tokio = { version = "1", features = ["rt", "macros", "io-std", "sync", "time", "signal", "net"] }
tokio-util = "0.7"
axum = "0.8"
tower-http = { version = "0.7", features = ["validate-request"] }
# Zendesk HTTP client. rustls with the platform verifier, so the Docker image only
# needs ca-certificates. HTTP/1.1 only: http2 and charset are left out to save size.
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webbrowser = "1"
sha2 = "0.11"
base64 = "0.23"
rand = "0.10"
url = "2"
uuid = { version = "1", features = ["v4"] }
rpassword = "7"
anyhow = "1"
thiserror = "2"
wiremock = "0.6"
tempfile = "3"

# Beyond clippy's defaults: lints from the Rust best-practices audit. CI denies warnings.
[workspace.lints.clippy]
allow_attributes_without_reason = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
or_fun_call = "warn"
redundant_clone = "warn"

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
