name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: zendesk-mcp-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: |
          docker run --rm zendesk-mcp-server:ci --version |
            grep '^zendesk-mcp-server '
          docker image inspect -f '{{.Size}} bytes' zendesk-mcp-server:ci

  # Once main is green, tag a version that has no tag yet and start its
  # release. A tag created with GITHUB_TOKEN triggers no workflow, so the
  # release is started explicitly.
  tag:
    needs: [test, docker]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Tag the new version and start the release
        run: |
          tag=v$(gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GH_REPO/contents/Cargo.toml?ref=$GITHUB_SHA" |
            python3 -c "$READ_VERSION")
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "$tag is already tagged"
            exit 0
          fi
          gh api "repos/$GH_REPO/git/refs" --silent \
            -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA"
          gh workflow run release.yml --ref "$tag"
          echo "Tagged $GITHUB_SHA as $tag and started the release"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          READ_VERSION: |
            import sys, tomllib
            cargo = tomllib.load(sys.stdin.buffer)
            print(cargo["workspace"]["package"]["version"])
